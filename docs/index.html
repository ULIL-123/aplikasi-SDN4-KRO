><span class="brandmark"><svg width="31" height="31" viewBox="0 0 32 32" fill="none"><path d="M3 16S8 8 16 8s13 8 13 8-5 8-13 8S3 16 3 16Z" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" stroke="currentColor" stroke-width="2"/></svg></span><span><b>jelajah<span style="color:#318e80">mata.</span></b><small>LIHAT · SENTUH · TEMUKAN</small></span></a><div class="tools"><span class="grade">IPAS · KELAS V SD</span><button class="tool" id="soundBtn" onclick="toggleSound()" aria-label="Aktifkan efek suara" aria-pressed="false"><span>♫</span> Suara mati</button><button class="tool" onclick="fullscreen()" aria-label="Layar penuh"><span>⛶</span> Layar penuh</button></div></div><nav class="mainnav" aria-label="Menu pembelajaran"><button data-page="beranda" onclick="go('beranda')">⌂ &nbsp; Beranda</button><button data-page="jelajah" onclick="go('jelajah')"><span class="num">01</span>Jelajah Mata</button><button data-page="materi" onclick="go('materi')"><span class="num">02</span>Materi</button><button data-page="lab" onclick="go('lab')"><span class="num">03</span>Lab Mini</button><button data-page="game" onclick="go('game')"><span class="num">04</span>Arena Game</button><button data-page="uji" onclick="go('uji')"><span class="num">05</span>Uji Kompetensi</button></nav></div></header><div class="shell"><div class="appbar"><div><b>Belajar di mana saja</b><small id="offlineState" role="status">Menyiapkan akses offline…</small></div><div class="buttons"><button class="secondary" onclick="installApp()">↓ Pasang aplikasi</button><button class="primary" onclick="shareApp()">Bagikan ↗</button></div></div><div id="updateBanner" hidden>Versi baru tersedia. Simpan hasil belajarmu sebelum memperbarui. <button onclick="updateApp()">Perbarui aplikasi</button></div></div><main class="shell" id="main"><div id="content"></div></main><div class="shell"><footer class="footer"><div><b>SD Negeri 4 Kronggen</b>Towards Literate School</div><span>Belajar sains lewat rasa ingin t <script>
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let page='beranda',part=0,seen=new Set(),lesson=0,sound=false,motion=false,audioCtx,quiz=null,game=null,brightness=55,tilt=0,lightOn=false,toastTimer;const achievements={};
const parts=[
{name:'Kornea',icon:'◡',short:'Jendela bening di bagian depan mata.',text:'Kornea adalah lapisan bening yang menutupi bagian depan mata. Cahaya melewatinya sebelum masuk lebih jauh. Bentuknya yang melengkung membantu membelokkan cahaya agar dapat difokuskan.',analogy:'Seperti jendela bening yang menjadi jalan masuk cahaya.',x:168,y:235},
{name:'Iris',icon:'◉',short:'Bagian berwarna yang mengatur besar pupil.',text:'Iris memberi warna pada mata, misalnya cokelat. Otot pada iris mengubah ukuran pupil. Saat terang, pupil mengecil. Saat redup, pupil membesar sehingga lebih banyak cahaya bisa masuk.',analogy:'Seperti pengatur bukaan pada kamera.',x:218,y:165},
{name:'Pupil',icon:'●',short:'Lubang tempat cahaya masuk.',text:'Pupil adalah lubang di tengah iris dan terlihat hitam. Pupil bukan benda hitam yang padat. Cahaya melewati lubang ini menuju lensa. Ukurannya diatur oleh iris.',analogy:'Seperti pintu masuk cahaya yang bisa diperbesar atau diperkecil.',x:218,y:235},
{name:'Lensa',icon:'⬭',short:'Membantu memfokuskan cahaya ke retina.',text:'Lensa terletak di belakang iris dan pupil. Bersama kornea, lensa memfokuskan cahaya agar bayangan jatuh pada retina. Bentuk lensa dapat berubah untuk membantu melihat benda dekat dan jauh.',analogy:'Seperti lensa kamera yang menyesuaikan fokus.',x:267,y:235},
{name:'Retina',icon:'◒',short:'Lapisan peka cahaya di bagian dalam belakang mata.',text:'Retina memiliki sel-sel peka cahaya. Sel tersebut mengubah cahaya menjadi sinyal listrik. Sinyal inilah yang kemudian dikirim menuju otak. Retina bukan layar yang mengirim foto secara langsung.',analogy:'Seperti sensor kamera yang menangkap cahaya.',x:480,y:180},
{name:'Saraf optik',icon:'⌁',short:'Pembawa sinyal penglihatan ke otak.',text:'Saraf optik membawa sinyal dari retina menuju otak. Otak mengolah sinyal tersebut sehingga kita mengenali bentuk, warna, dan benda yang kita lihat.',analogy:'Seperti kabel pembawa pesan dari mata menuju otak.',x:541,y:287},
{name:'Sklera',icon:'◯',short:'Lapisan luar yang kuat dan berwarna putih.',text:'Sklera adalah bagian luar bola mata yang kuat. Lapisan ini melindungi bagian dalam mata dan membantu mempertahankan bentuk bola mata. Bagian putih yang tampak dari luar adalah sklera.',analogy:'Seperti pelindung kokoh bagi bagian dalam mata.',x:370,y:75}
];
function eyeFront(id='front',hero=false){let rays='';for(let i=0;i<100;i++){const a=i*Math.PI/50,r=51+(i%4)*3;const x=250+Math.cos(a)*r,y=190+Math.sin(a)*r,x2=250+Math.cos(a)*89,y2=190+Math.sin(a)*89;rays+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${i%3?'#68b6a3':'#d7cf7c'}" stroke-opacity=".53" stroke-width="${i%3?1.5:2.5}"/>`}return `<svg class="${hero?'eyehero':'frontEye'}" id="${id}" viewBox="0 0 500 390" role="img" aria-label="Ilustrasi berdimensi tampak depan mata: sklera putih, iris berwarna, dan pupil hitam"><defs><radialGradient id="s-${id}" cx="36%" cy="27%" r="75%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#fffef1"/><stop offset=".8" stop-color="#d1e1d3"/><stop offset="1" stop-color="#7eaaa1"/></radialGradient><radialGradient id="i-${id}"><stop stop-color="#9baf5e"/><stop offset=".4" stop-color="#398a77"/><stop offset=".78" stop-color="#2a8176"/><stop offset="1" stop-color="#104f4c"/></radialGradient><radialGradient id="g-${id}"><stop stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><ellipse cx="250" cy="335" rx="125" ry="15" fill="#245e50" opacity=".08"/><circle cx="250" cy="190" r="153" fill="url(#s-${id})"/><path d="M115 178q24-46 53-42M134 240q20-27 39-30M349 128q22 4 34 20" fill="none" stroke="#c4a092" stroke-width="2" opacity=".4"/><circle cx="250" cy="190" r="94" fill="#2e665b"/><circle cx="250" cy="190" r="89" fill="url(#i-${id})"/>${rays}<circle cx="250" cy="190" r="44" fill="#47685b" opacity=".55"/><circle id="pupil-${id}" cx="250" cy="190" r="${hero?39:53-brightness*.32}" fill="#102d2d"/><ellipse cx="221" cy="154" rx="22" ry="31" fill="white" opacity=".88" transform="rotate(35 221 154)"/><circle cx="280" cy="221" r="9" fill="#fff" opacity=".6"/><ellipse cx="208" cy="103" rx="73" ry="41" fill="url(#g-${id})" transform="rotate(-25 208 103)"/></svg>`}
function anatomy(selected=part,mode='explore'){const labels=parts.map((p,i)=>`<g role="button" tabindex="0" aria-label="${mode==='hunt'?'Pilih ':''}${p.name}" class="${selected===i?'selected':''}" onclick="${mode==='hunt'?'huntAnswer':'selectPart'}(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${mode==='hunt'?'huntAnswer':'selectPart'}(${i})}"><circle cx="${p.x}" cy="${p.y}" r="25" fill="transparent"/><circle class="hot" cx="${p.x}" cy="${p.y}" r="17"/><text x="${p.x}" y="${p.y+5}" text-anchor="middle">${i+1}</text></g>`).join('');return `<svg class="anatomy" viewBox="0 0 660 400" aria-label="Penampang sederhana mata, bagian depan di kiri dan saraf optik di kanan" role="group"><defs><radialGradient id="outer"><stop stop-color="#fff"/><stop offset=".72" stop-color="#f5f6e9"/><stop offset="1" stop-color="#b8cec2"/></radialGradient><radialGradient id="inside"><stop stop-color="#fcf2da"/><stop offset="1" stop-color="#f4c4a3"/></radialGradient><linearGradient id="lens" x2="1" y2="1"><stop stop-color="#f1feff"/><stop offset=".5" stop-color="#9fd9cf"/><stop offset="1" stop-color="#39988f"/></linearGradient></defs><ellipse cx="347" cy="357" rx="191" ry="13" fill="#163e33" opacity=".06"/><path d="M480 258 Q523 269 571 279L570 313Q521 303 484 292Z" fill="#edbe76" stroke="#dba261" stroke-width="3"/><path d="M495 274L567 293M496 284L565 303" stroke="#fbe1a7" stroke-width="5"/><ellipse cx="340" cy="215" rx="181" ry="151" fill="url(#outer)" stroke="#9dbdb1" stroke-width="2"/><ellipse cx="340" cy="215" rx="161" ry="133" fill="#cf8c71"/><ellipse cx="340" cy="215" rx="153" ry="125" fill="#efb380"/><ellipse cx="340" cy="215" rx="146" ry="118" fill="url(#inside)"/><path d="M216 125C136 137 132 292 216 306Q173 219 216 125Z" fill="#b4e0dc" fill-opacity=".7" stroke="#78b9b6" stroke-width="4"/><path d="M219 126L219 213M219 257L219 304" stroke="#438c74" stroke-width="16" stroke-linecap="round"/><path d="M213 127L213 211M213 259L213 303" stroke="#9eb275" stroke-width="5"/><ellipse cx="267" cy="235" rx="27" ry="69" fill="url(#lens)" stroke="#69aaa1" stroke-width="2"/><path d="M253 175L238 139M254 296L238 312" stroke="#b97f60" stroke-width="4"/><path d="M464 142Q511 220 476 271" fill="none" stroke="#b56f5c" stroke-width="2" opacity=".5"/><text x="58" y="365" style="font-size:12px;fill:#7c9586">DEPAN MATA</text><text x="485" y="365" style="font-size:12px;fill:#7c9586">MENUJU OTAK →</text>${lightOn?'<path class="beam" d="M40 225L163 225L218 232L267 234L487 238" stroke="#eaa23d" stroke-width="5" fill="none"/><path d="M477 229L489 238L476 246" stroke="#eaa23d" stroke-width="4" fill="none"/>':''}${labels}</svg>`}
function nav(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')})}
function go(p){if(!['beranda','jelajah','materi','lab','game','uji','latihan'].includes(p))p='beranda';page=p;stopRead();location.hash=p;render();window.scrollTo({top:0,behavior:motion?'instant':'smooth'})}
function heading(k,t,d,tag=''){return `<div class="pageheading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>${tag?`<span class="badge">${tag}</span>`:''}</div>`}
function render(){nav();const renderers={beranda:home,jelajah:explore,materi:material,lab:lab,game:arena,uji:()=>quiz&&quiz.mode==='uji'?renderQuiz():quizIntro('uji'),latihan:()=>quiz&&quiz.mode==='latihan'?renderQuiz():quizIntro('latihan')};$('#content').innerHTML=renderers[page]();if(page==='lab')updateLab();}
function home(){return `<section class="hero"><div><span class="pill"><i></i> MEDIA PEMBELAJARAN INTERAKTIF</span><h1>Dunia penuh warna.<br/>Bagaimana mata<br/><em>melihatnya?</em></h1><p class="lead">Ayo jadi penjelajah cilik! Kenali bagian mata, ikuti perjalanan cahaya, dan selesaikan misi seru bersama.</p><div class="buttons"><button class="primary" onclick="go('jelajah')">Mulai menjelajah &nbsp; →</button><button class="secondary" onclick="showInfo('panduan')">▷ &nbsp; Cara bermain</button></div><div class="micro">☝ &nbsp; Sentuh langsung · Tanpa perlu mouse · Bisa belajar offline</div><div class="facts"><div><b>7 bagian</b><small>mata untuk dijelajahi</small></div><div><b>3 misi</b><small>game interaktif</small></div><div><b>10 soal</b><small>uji kompetensi</small></div></div></div><div class="heroart"><span class="orbitdot">✦</span>${eyeFront('hero',true)}<span class="floatlabel labelone">◉ &nbsp; Kecil, tetapi luar biasa<small>Mata membantu kita mengenal dunia.</small></span><span class="floatlabel labeltwo">✧ &nbsp; Siap jadi ahli mata?<small>Sentuh. Pelajari. Taklukkan misinya!</small></span><span class="artcaption">VISUAL BERLAPIS · ANIMASI · INTERAKSI</span></div></section><div class="sectiontitle"><div><h2>Petualangan belajarmu</h2><p>Mulai dari rasa ingin tahu, pulang membawa pengetahuan baru.</p></div><span class="badge">BELAJAR SAMBIL BERMAIN</span></div><div class="journey"><button onclick="go('jelajah')"><span class="tileicon">◉</span><span class="arrow">→</span><h3>Kenali mata</h3><p>Sentuh bagian mata dan temukan tugasnya.</p></button><button onclick="go('lab')"><span class="tileicon">☀</span><span class="arrow">→</span><h3>Coba di lab mini</h3><p>Ubah cahaya. Amati ukuran pupil!</p></button><button onclick="go('game')"><span class="tileicon">⚑</span><span class="arrow">→</span><h3>Taklukkan misi</h3><p>Cari bagian, susun alur, pilih kebiasaan.</p></button><button onclick="go('uji')"><span class="tileicon">☆</span><span class="arrow">→</span><h3>Uji kemampuan</h3><p>Dapatkan skor dan pembahasan lengkap.</p></button></div><div class="teachnote"><div><b>Untuk penjelajah kelas V SD</b><p>Tujuan: mengenali bagian mata, menjelaskan proses melihat, serta memilih kebiasaan merawat mata. Gunakan bergantian pada tablet, laptop, atau layar sentuh kelas.</p></div><button onclick="go('materi')">Lihat materi &nbsp; →</button></div>`}
function explore(){seen.add(part);const p=parts[part];return heading('01 / JELAJAH MATA','Satu mata, banyak kerja sama.','Sentuh titik angka atau tombol nama bagian. Setiap bagian punya tugas penting.','MODEL INTERAKTIF')+`<div class="exploregrid"><div class="panel modelpanel"><div class="paneltop"><b>Penampang mata</b><small>Depan di kiri · belakang di kanan</small></div>${anatomy()}<p class="figure-note">Ilustrasi pembelajaran yang disederhanakan, tidak berskala. Angka menunjukkan lokasi bagian.</p><div class="partnames">${parts.map((p,i)=>`<button class="${part===i?'selected':''}" onclick="selectPart(${i})" aria-pressed="${part===i}">${i+1}. ${p.name}</button>`).join('')}</div></div><section class="panel partdetail" aria-live="polite"><div class="eyebrow">BAGIAN ${part+1} DARI 7</div><div class="bigicon">${p.icon}</div><h2>${p.name}</h2><p>${p.text}</p><div class="analogy"><small>BAYANGKAN SEPERTI…</small>${p.analogy}</div><div class="buttons"><button class="secondary" onclick="readPart()">♫ Dengarkan</button><button class="secondary" onclick="selectPart(${(part+1)%7})">Bagian berikutnya →</button></div></section></div><div class="explored">${seen.size} dari 7 bagian telah dibuka<div class="completion"><i style="width:${seen.size/7*100}%"></i></div>${seen.size===7?'Hebat! Semua bagian sudah kamu jelajahi. Lanjutkan ke materi atau latihan.':'Ayo temukan tugas bagian yang belum kamu sentuh.'}</div><div class="buttons"><button class="primary" onclick="go('materi')">Lanjut ke materi →</button><button class="secondary" onclick="go('latihan')">Latihan soal</button></div>`}
function selectPart(i){stopRead();part=i;beep();render()}function readPart(){playNarration('bagian-'+part,parts[part].name)}
const lessons=[{title:'Mata dan fungsinya',body:`<h2>Mata: indra penglihatan kita.</h2><p>Mata membantu kita melihat cahaya, warna, bentuk, dan gerakan. Kita bisa membaca tulisan, menemukan jalan, dan mengenali benda karena mata bekerja sama dengan otak.</p><div class="callout"><b>Ingat!</b> Agar sebuah benda terlihat, cahaya dari benda harus masuk ke mata. Mata tidak memancarkan cahaya untuk melihat.</div><h3>Setelah belajar, aku bisa…</h3><div class="objective"><strong>01</strong><span>Menyebutkan bagian mata dan menghubungkannya dengan fungsi masing-masing.</span></div><div class="objective"><strong>02</strong><span>Menjelaskan urutan sederhana cahaya sampai kita melihat.</span></div><div class="objective"><strong>03</strong><span>Memilih kebiasaan yang membantu menjaga kesehatan mata.</span></div><h3>Pelindung dari luar</h3><p>Kelopak dan bulu mata membantu melindungi mata. Berkedip menyebarkan air mata pada permukaan mata agar tetap lembap.</p>`},{title:'Perjalanan cahaya',body:`<h2>Dari cahaya menjadi penglihatan.</h2><p>Perhatikan buku di depanmu. Cahaya yang dipantulkan buku masuk ke mata. Bagian-bagian mata bekerja bersama, lalu otak mengolah sinyalnya.</p><div class="stepflow"><div class="flowstep"><span>LANGKAH 01</span><b>Kornea</b><p>Cahaya melewati bagian depan yang bening dan mulai dibelokkan.</p></div><div class="flowstep"><span>LANGKAH 02</span><b>Pupil</b><p>Cahaya masuk lewat lubang yang ukurannya diatur iris.</p></div><div class="flowstep"><span>LANGKAH 03</span><b>Lensa</b><p>Cahaya difokuskan menuju lapisan belakang mata.</p></div><div class="flowstep"><span>LANGKAH 04</span><b>Retina</b><p>Sel peka cahaya mengubah cahaya menjadi sinyal listrik.</p></div><div class="flowstep"><span>LANGKAH 05</span><b>Saraf optik</b><p>Sinyal dibawa dari retina menuju otak.</p></div><div class="flowstep"><span>LANGKAH 06</span><b>Otak</b><p>Sinyal diolah sehingga kita mengenali apa yang dilihat.</p></div></div><div class="callout">Cahaya mencapai retina. Sesudah retina, yang dibawa saraf optik adalah <b>sinyal listrik</b>, bukan berkas cahaya.</div><p>Bayangan optik pada retina terbentuk terbalik. Otak mengolah informasi penglihatan sehingga kita dapat memahami posisi benda.</p>`},{title:'Iris, pupil & fokus',body:`<h2>Mata menyesuaikan diri.</h2><h3>☀ Saat cahaya terang</h3><p>Iris membuat pupil mengecil sehingga cahaya yang masuk berkurang.</p><h3>☾ Saat cahaya redup</h3><p>Iris membuat pupil membesar sehingga lebih banyak cahaya bisa masuk. Namun, mata tetap memerlukan cahaya. Dalam gelap total, kita tidak dapat melihat benda.</p><div class="callout"><b>Iris = pengatur.</b> <b>Pupil = lubang yang diatur.</b> Dua bagian ini berbeda, tetapi bekerja bersama.</div><h3>Dekat dan jauh</h3><p>Lensa dapat berubah bentuk untuk membantu memfokuskan cahaya dari benda pada jarak berbeda. Proses penyesuaian ini disebut <b>akomodasi</b>. Kornea juga membantu memfokuskan cahaya.</p><button class="primary" onclick="go('lab')">Coba perubahan pupil di lab →</button>`},{title:'Rawat mata kita',body:`<h2>Mata bekerja keras. Yuk, rawat!</h2><ul><li><b>Beri jeda dari layar.</b> Sesekali alihkan pandangan ke tempat yang lebih jauh dan istirahatkan mata.</li><li><b>Gunakan cahaya yang cukup</b> saat membaca agar terasa nyaman.</li><li><b>Makan beragam makanan bergizi,</b> termasuk sayur dan buah, serta lakukan aktivitas fisik.</li><li><b>Gunakan pelindung mata yang sesuai</b> saat melakukan kegiatan yang berisiko melukai mata, dengan pendampingan orang dewasa.</li><li><b>Jangan menatap matahari langsung</b> atau mengarahkan laser ke mata.</li><li><b>Sampaikan kepada orang dewasa</b> jika penglihatan kabur, mata sakit, atau sulit melihat papan tulis, agar mendapat pemeriksaan yang tepat.</li></ul><div class="callout">Makanan bergizi membantu kesehatan tubuh dan mata. Makan wortel saja <b>tidak otomatis menyembuhkan semua gangguan penglihatan</b>.</div><p>Latih kebiasaan baik bersama keluarga dan guru. Belajar dari layar juga perlu diselingi istirahat.</p>`}];
function material(){return heading('02 / MATERI','Pahami cara mata bekerja.','Baca sedikit demi sedikit, dengarkan jika tersedia, lalu coba latihan.')+`<div class="tabs">${lessons.map((x,i)=>`<button class="${lesson===i?'selected':''}" onclick="setLesson(${i})">${i+1}. ${x.title}</button>`).join('')}</div><article class="panel lesson" id="lessonbody">${lessons[lesson].body}</article><div class="quiznav"><button class="secondary" onclick="readLesson()">♫ Dengarkan materi</button><div class="buttons">${lesson>0?'<button class="secondary" onclick="setLesson(lesson-1)">← Sebelumnya</button>':''}<button class="primary" onclick="${lesson<3?'setLesson(lesson+1)':"go('latihan')"}">${lesson<3?'Materi berikutnya →':'Mulai latihan soal →'}</button></div></div><p class="source">Rujukan: National Eye Institute, “How the Eyes Work”, “About the Eye”, dan “Healthy Vision Tips”. <button onclick="showInfo('sumber')">Lihat sumber →</button></p>`}
function setLesson(i){lesson=i;stopRead();render();window.scrollTo({top:0})}function readLesson(){playNarration('materi-'+lesson,lessons[lesson].title)}
function lab(){return heading('03 / LAB MINI','Terang atau redup, apa yang berubah?','Geser pengatur cahaya, lalu amati pupil di tengah iris. Simulasi ini tidak memakai kamera atau lampu perangkat.','SENTUH & GESER')+`<div class="twocol"><div class="panel labstage"><span class="badge" id="lightLabel">Cahaya sedang</span><div id="eyeTilt" style="transition:transform .2s">${eyeFront('lab')}</div><p class="figure-note">Model respons pupil untuk pembelajaran. Ukuran dan kecepatan perubahan disederhanakan.</p></div><div class="panel labcontrols"><h3>Kamu pegang kendalinya.</h3><div class="rangegroup"><label for="brightness">Intensitas cahaya <output id="brightValue">${brightness}%</output></label><input id="brightness" type="range" min="0" max="100" value="${brightness}" oninput="brightness=Number(this.value);updateLab()"><small>☾ Redup &nbsp; ↔ &nbsp; Terang ☀</small></div><div class="labstatus" id="labstatus" aria-live="polite"></div><div class="rangegroup"><label for="tilt">Sudut tampilan <output id="tiltValue">${tilt}°</output></label><input id="tilt" type="range" min="-25" max="25" value="${tilt}" oninput="tilt=Number(this.value);updateLab()"><small>Geser untuk memiringkan ilustrasi berdimensi.</small></div><div class="buttons" style="margin-top:18px"><button class="secondary" onclick="brightness=10;updateLab()">☾ Redup</button><button class="secondary" onclick="brightness=90;updateLab()">☀ Terang</button></div><p class="hint" style="margin-top:20px">Tantangan: apa yang terjadi pada pupil jika cahaya bertambah? Bagian mana yang mengaturnya?</p></div></div><div class="teachnote"><div><b>Cahaya berhenti di retina, pesan berlanjut ke otak.</b><p>Telusuri kembali urutan sederhana proses melihat pada materi atau game Susun Jalur Cahaya.</p></div><button onclick="startGame('urut')">Coba game urutan →</button></div>`}
function updateLab(){if(!$('#pupil-lab'))return;$('#pupil-lab').setAttribute('r',53-brightness*.32);$('#brightness').value=brightness;$('#brightValue').textContent=brightness+'%';$('#tiltValue').textContent=tilt+'°';$('#eyeTilt').style.transform=`perspective(700px) rotateY(${tilt}deg) rotateZ(${tilt/5}deg)`;$('#lightLabel').textContent=brightness<35?'Cahaya redup':brightness>65?'Cahaya terang':'Cahaya sedang';$('#labstatus').innerHTML=brightness<35?'<b>Pupil lebih besar.</b>Iris memperbesar bukaan agar lebih banyak cahaya masuk.':brightness>65?'<b>Pupil lebih kecil.</b>Iris memperkecil bukaan agar cahaya yang masuk berkurang.':'<b>Pupil berukuran sedang.</b>Geser ke kiri dan kanan untuk membandingkan respons pupil.'}

function quizIntro(mode){let exam=mode==='uji';return heading(exam?'05 / UJI KOMPETENSI':'LATIHAN / PEMANTAPAN',exam?'Saatnya menunjukkan kemampuanmu.':'Latihan dulu, makin percaya diri.','Baca pertanyaan, sentuh satu jawaban, dan pelajari pembahasannya.')+`<section class="panel intro"><span class="tileicon" style="margin:0 auto;font-size:32px">${exam?'☆':'✎'}</span><h2>${exam?'Misi Penjelajah Mata':'Latihan Cerdas'}</h2><p>${exam?'Kerjakan 10 soal acak secara mandiri. Setiap jawaban benar bernilai 10. Skor dan pembahasan semua soal ditampilkan setelah kamu selesai.':'Kerjakan 8 soal latihan. Kamu langsung mendapat penjelasan setelah mengunci jawaban. Tidak ada batas waktu, jadi gunakan waktumu untuk berpikir.'}</p><div class="rules"><span>${exam?'10':'8'} soal</span><span>Tanpa batas waktu</span><span>Skor 0–100</span><span>${exam?'Pembahasan di akhir':'Pembahasan langsung'}</span></div><label>Nama panggilan (opsional)<input id="studentName" autocomplete="off" maxlength="40" placeholder="Contoh: Nara"></label><p class="hint">Nama dan hasil hanya digunakan selama halaman ini terbuka. Hasil dapat diunduh atau dicetak.</p><div class="buttons"><button class="primary orange" onclick="startQuiz('${mode}')">${exam?'Mulai uji kompetensi':'Mulai latihan'} &nbsp; →</button><button class="secondary" onclick="go('materi')">Baca materi</button></div></section>`}
function startQuiz(mode){const name=($('#studentName')?.value||'Penjelajah').trim()||'Penjelajah';let indices=mode==='uji'?shuffle(bank.map((_,i)=>i)).slice(0,10):[0,1,2,5,7,9,11,14];quiz={mode,name,items:indices.map(idx=>{const b=bank[idx],order=shuffle([0,1,2,3]);return {...b,o:order.map(i=>b.o[i]),a:order.indexOf(b.a)}}),answers:[],at:0,chosen:null,locked:false,finished:false};page=mode==='uji'?'uji':'latihan';location.hash=page;render();beep();window.scrollTo({top:0})}
function renderQuiz(){if(quiz.finished)return quizResult();const q=quiz.items[quiz.at],correct=quiz.answers.filter((a,i)=>a===quiz.items[i].a).length;return heading(quiz.mode==='uji'?'05 / UJI KOMPETENSI':'LATIHAN / PEMANTAPAN',quiz.mode==='uji'?'Misi Penjelajah Mata':'Latihan Cerdas',`Semangat, ${esc(quiz.name)}! Pilih jawaban yang menurutmu paling tepat.`)+`<section class="panel gamearea"><div class="quiztop"><span>Soal <b>${quiz.at+1}</b> dari ${quiz.items.length}</span><span class="badge">${q.topic}</span>${quiz.mode==='latihan'?`<span class="scorepill">Benar ${correct}/${quiz.items.length}</span>`:''}</div><div class="completion"><i style="width:${quiz.at/quiz.items.length*100}%"></i></div><h2 class="quiztitle">${q.q}</h2><div class="options">${q.o.map((o,i)=>`<button class="option ${quiz.chosen===i?'chosen':''} ${quiz.locked?(i===q.a?'correct':i===quiz.chosen?'incorrect':''):''}" onclick="choose(${i})" ${quiz.locked?'disabled':''} aria-pressed="${quiz.chosen===i}"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>${quiz.locked?`<div class="feedback ${quiz.chosen===q.a?'':'wrong'}" role="status"><b>${quiz.chosen===q.a?'✓ Tepat sekali!':'↻ Yuk, pahami kembali.'}</b><p><strong>Jawaban benar: ${q.o[q.a]}.</strong> ${q.e}</p></div>`:''}<div class="quiznav"><p>${quiz.locked?'Sudah memahami penjelasannya? Lanjutkan.':'Jawaban bisa diganti sebelum dikunci.'}</p><button class="primary" onclick="${quiz.locked?'nextQuiz()':'lockQuiz()'}" ${quiz.chosen===null?'disabled':''}>${quiz.locked?(quiz.at===quiz.items.length-1?'Lihat hasil →':'Soal berikutnya →'):(quiz.mode==='uji'?(quiz.at===quiz.items.length-1?'Kunci & lihat hasil →':'Kunci & lanjut →'):'Periksa jawaban ✓')}</button></div></section><p class="hint" style="text-align:center;margin-top:18px">${quiz.mode==='uji'?'Pembahasan tersedia setelah semua soal dijawab.':'Skor latihan = jumlah jawaban benar ÷ 8 × 100, dibulatkan ke bilangan bulat.'}</p>`}
function choose(i){if(quiz.locked||quiz.finished)return;quiz.chosen=i;render()}
function lockQuiz(){if(quiz.chosen===null||quiz.locked||quiz.finished)return;quiz.answers[quiz.at]=quiz.chosen;if(quiz.mode==='latihan'){quiz.locked=true;beep(quiz.chosen===quiz.items[quiz.at].a?'good':'bad');render()}else nextQuiz()}
function nextQuiz(){if(quiz.at===quiz.items.length-1){quiz.finished=true;achievements[quiz.mode]=Math.round(quiz.answers.filter((a,i)=>a===quiz.items[i].a).length/quiz.items.length*100);beep('good')}else{quiz.at++;quiz.chosen=null;quiz.locked=false}render();window.scrollTo({top:0})}
function quizResult(){const correct=quiz.answers.filter((a,i)=>a===quiz.items[i].a).length,score=Math.round(correct/quiz.items.length*100),missed=[...new Set(quiz.items.filter((q,i)=>quiz.answers[i]!==q.a).map(q=>q.topic))];return `<div class="gamearea"><section class="resulttop"><div class="eyebrow" style="color:#adcab7">${quiz.mode==='uji'?'UJI KOMPETENSI':'LATIHAN'} SELESAI</div><h2>${score>=80?'Luar biasa, ':score>=60?'Terus berkembang, ':'Terus mencoba, '}${esc(quiz.name)}!</h2><div class="resultscore"><div>${score}<small>DARI 100</small></div></div><p>${correct} benar · ${quiz.items.length-correct} perlu dipelajari lagi · ${quiz.items.length} soal</p><div class="buttons"><button class="secondary" onclick="printResult()">⎙ Cetak hasil</button><button class="secondary" onclick="downloadResult()">↓ Unduh hasil</button><button class="secondary" onclick="quiz=null;render()">↻ Coba lagi</button></div></section><div class="panel"><h3>Langkah belajarmu berikutnya</h3><p style="margin-top:12px">${missed.length?'Pelajari kembali: <b>'+missed.join(', ')+'</b>. Buka pembahasan di bawah, lalu coba materi atau latihan lagi.':'Kamu menjawab semua soal dengan tepat! Coba jelaskan cara kerja mata kepada temanmu dengan kata-katamu sendiri.'}</p><p class="hint" style="margin-top:10px">Skor ini adalah hasil aktivitas belajar, bukan penetapan nilai ketuntasan sekolah.</p></div><div class="sectiontitle"><h2>Jawaban & pembahasan</h2><button class="secondary" onclick="document.querySelectorAll('.review details').forEach(d=>d.open=true)">Buka semua</button></div>${quiz.items.map((q,i)=>`<article class="review"><h3>${quiz.answers[i]===q.a?'✓':'○'} ${i+1}. ${q.q}</h3><p class="${quiz.answers[i]===q.a?'answer':'wronganswer'}">Jawabanmu: ${q.o[quiz.answers[i]]}</p><p class="answer">Jawaban benar: ${q.o[q.a]}</p><details ${quiz.answers[i]!==q.a?'open':''}><summary>Pembahasan &nbsp; ▾</summary><p>${q.e}</p></details></article>`).join('')}<div class="buttons"><button class="primary" onclick="go('materi')">Pelajari materi →</button><button class="secondary" onclick="go('game')">Ke arena game</button></div></div>`}
function printResult(){document.querySelectorAll('.review details').forEach(d=>d.open=true);window.print()}
function downloadResult(){const score=Math.round(quiz.answers.filter((a,i)=>a===quiz.items[i].a).length/quiz.items.length*100);const text=['JELAJAH MATA — KELAS V SD','SD Negeri 4 Kronggen | Towards Literate School',`Nama: ${quiz.name}`,`Aktivitas: ${quiz.mode==='uji'?'Uji kompetensi':'Latihan'}`,`Skor: ${score}/100`,'',...quiz.items.map((q,i)=>`${i+1}. ${q.q}\nJawaban siswa: ${q.o[quiz.answers[i]]}\nJawaban benar: ${q.o[q.a]}\nPembahasan: ${q.e}\n`) ].join('\n');download(text,'Hasil_Jelajah_Mata.txt','text/plain;charset=utf-8')}
const huntQuestions=[{target:0,q:'Temukan jendela bening di bagian depan mata.'},{target:1,q:'Temukan bagian yang mengatur ukuran pupil.'},{target:3,q:'Temukan bagian di belakang pupil yang membantu memfokuskan cahaya.'},{target:4,q:'Temukan lapisan peka cahaya yang mengubah cahaya menjadi sinyal.'},{target:5,q:'Temukan pembawa sinyal menuju otak.'},{target:6,q:'Temukan lapisan luar yang kuat dan melindungi bola mata.'}];
const habits=[{icon:'☀',q:'Menatap matahari langsung untuk menguji ketajaman mata.',good:false,e:'Jangan menatap matahari secara langsung. Cahaya matahari dapat membahayakan mata.'},{icon:'▣',q:'Memberi jeda saat belajar dengan layar dan melihat ke tempat yang lebih jauh.',good:true,e:'Jeda membantu mengistirahatkan mata dari kegiatan melihat dekat terus-menerus.'},{icon:'✦',q:'Mengarahkan laser ke mata teman saat bermain.',good:false,e:'Laser tidak boleh diarahkan ke mata. Pilih permainan yang aman bersama teman.'},{icon:'♧',q:'Makan beragam sayur, buah, dan makanan bergizi seimbang.',good:true,e:'Gizi seimbang mendukung kesehatan mata dan tubuh. Tidak cukup hanya mengandalkan satu jenis makanan.'},{icon:'☏',q:'Memberi tahu guru atau orang tua saat sulit melihat tulisan di papan.',good:true,e:'Orang dewasa dapat membantu mendapatkan pemeriksaan yang sesuai ketika ada keluhan penglihatan.'},{icon:'▤',q:'Membaca dengan pencahayaan yang cukup dan nyaman.',good:true,e:'Pencahayaan yang cukup membantu membaca dengan nyaman. Hindari cahaya menyilaukan langsung ke mata.'}];
function arena(){if(game)return renderGame();return heading('04 / ARENA GAME','Belajar terasa seperti bermain.','Pilih misimu. Setiap jawaban punya penjelasan, jadi kesalahan adalah kesempatan belajar.','3 MISI INTERAKTIF')+`<div class="gamecards"><button class="gamecard panel" onclick="startGame('hunt')"><span class="tileicon">⌖</span><h2>Detektif Mata</h2><p>Baca petunjuk, lalu sentuh bagian yang tepat pada ilustrasi mata.</p><div class="gamefoot"><span>6 tantangan · skor 0–100</span><span>Mulai →</span></div></button><button class="gamecard panel" onclick="startGame('urut')"><span class="tileicon">⇢</span><h2>Jalur Cahaya</h2><p>Susun perjalanan dari cahaya masuk hingga otak mengolah sinyalnya.</p><div class="gamefoot"><span>6 langkah · skor 0–100</span><span>Mulai →</span></div></button><button class="gamecard panel" onclick="startGame('habit')"><span class="tileicon">♡</span><h2>Sahabat Mata</h2><p>Pilih kebiasaan yang baik dan yang perlu dihindari. Siap menjaga mata?</p><div class="gamefoot"><span>6 situasi · skor 0–100</span><span>Mulai →</span></div></button></div><div class="teachnote"><div><b>Ingin berlatih dengan pilihan jawaban?</b><p>Tersedia 8 soal latihan dengan skor dan pembahasan langsung.</p></div><button class="primary" onclick="go('latihan')">Buka latihan soal →</button></div>`}
function startGame(type){game={type,at:0,score:0,answer:null,finished:false,items:type==='hunt'?shuffle(huntQuestions):type==='habit'?shuffle(habits):[],order:[],pool:shuffle(['Kornea','Pupil','Lensa','Retina','Saraf optik','Otak']),locked:false};page='game';location.hash=page;render();window.scrollTo({top:0});beep()}
function renderGame(){if(game.finished)return gameResult();const t={hunt:'Detektif Mata',urut:'Jalur Cahaya',habit:'Sahabat Mata'}[game.type];let html=`<div class="gamearea"><div class="gamehead"><button class="back" onclick="leaveGame()">← Pilih misi lain</button><span class="scorepill">${game.type==='urut'?'6 langkah perjalanan':`${game.at+1}/6 · ${game.score} benar`}</span></div><section class="panel challenge"><div class="eyebrow">${t.toUpperCase()}</div>`;if(game.type==='hunt'){const q=game.items[game.at];html+=`<h2>${q.q}</h2>${anatomy(game.answer===null?-1:game.answer,'hunt')}<div class="partnames" style="justify-content:center">${parts.map((p,i)=>`<button onclick="huntAnswer(${i})" ${game.answer!==null?'disabled':''}>${i+1}. ${p.name}</button>`).join('')}</div>${game.answer===null?'<p class="hint" style="margin-top:15px">Sentuh angka atau nama bagian. Jawaban pertama akan dihitung.</p>':`<div class="feedback ${game.answer===q.target?'':'wrong'}" role="status"><b>${game.answer===q.target?'✓ Kamu menemukannya!':'↻ Bagian yang dimaksud: '+parts[q.target].name}</b><p>${parts[q.target].short}</p></div><button class="primary" onclick="nextGame()">${game.at===5?'Lihat hasil':'Tantangan berikutnya'} →</button>`}`;}else if(game.type==='habit'){const q=game.items[game.at];html+=`<div class="habiticon">${q.icon}</div><h2>${q.q}</h2><div class="options"><button class="option" onclick="habitAnswer(true)" ${game.answer!==null?'disabled':''}>♡ &nbsp; Kebiasaan baik</button><button class="option" onclick="habitAnswer(false)" ${game.answer!==null?'disabled':''}>✕ &nbsp; Perlu dihindari</button></div>${game.answer!==null?`<div class="feedback ${game.answer===q.good?'':'wrong'}" role="status"><b>${game.answer===q.good?'✓ Pilihanmu tepat!':'↻ Yuk, pelajari alasannya.'}</b><p><strong>${q.good?'Kebiasaan baik.':'Perlu dihindari.'}</strong> ${q.e}</p></div><button class="primary" onclick="nextGame()">${game.at===5?'Lihat hasil':'Situasi berikutnya'} →</button>`:'<p class="hint" style="margin-top:20px">Pikirkan mana yang membantu melindungi mata.</p>'}`;}else{html+=`<h2>Susun perjalanan sampai kita melihat.</h2><p>Sentuh kartu secara berurutan. Sentuh lagi kartu di urutanmu untuk mengembalikannya.</p><div class="sequence">${game.order.length?game.order.map((x,i)=>`<button onclick="removeToken(${i})">${i+1}. ${x} ×</button>`).join(''):'<span>Mulai dari bagian paling depan yang dilewati cahaya…</span>'}</div><div class="tokenpool">${game.pool.filter(x=>!game.order.includes(x)).map(x=>`<button class="token" onclick="addToken('${x}')">+ ${x}</button>`).join('')}</div><p class="hint">Di retina, cahaya diubah menjadi sinyal. Urutan ini melanjutkan perjalanan sinyal sampai ke otak.</p><div class="buttons" style="justify-content:center;margin-top:22px"><button class="secondary" onclick="game.order=[];render()">Susun ulang</button><button class="primary" ${game.order.length!==6?'disabled':''} onclick="checkOrder()">Periksa urutan ✓</button></div>`}return html+'</section></div>'}
function huntAnswer(i){if(!game||game.type!=='hunt'||game.answer!==null||game.finished)return;game.answer=i;if(i===game.items[game.at].target)game.score++;beep(i===game.items[game.at].target?'good':'bad');render()}
function habitAnswer(v){if(!game||game.type!=='habit'||game.answer!==null||game.finished)return;game.answer=v;if(v===game.items[game.at].good)game.score++;beep(v===game.items[game.at].good?'good':'bad');render()}
function nextGame(){if(game.answer===null)return;if(game.at===5){game.finished=true;achievements[game.type]=Math.round(game.score/6*100)}else{game.at++;game.answer=null}render();window.scrollTo({top:0})}
function addToken(x){if(game.order.includes(x)||game.order.length===6)return;game.order.push(x);beep();render()}function removeToken(i){game.order.splice(i,1);render()}
function checkOrder(){if(game.order.length!==6||game.finished)return;const correct=['Kornea','Pupil','Lensa','Retina','Saraf optik','Otak'];game.score=game.order.filter((x,i)=>x===correct[i]).length;game.finished=true;achievements.urut=Math.round(game.score/6*100);beep(game.score===6?'good':'bad');render();window.scrollTo({top:0})}
function gameResult(){const score=Math.round(game.score/6*100),type=game.type;return `<div class="gamearea"><div class="resulttop"><div class="eyebrow" style="color:#abcbb9">MISI SELESAI</div><h2>${score===100?'Hebat, misi sempurna!':'Misi selesai. Kamu terus belajar!'}</h2><div class="resultscore"><div>${score}<small>DARI 100</small></div></div><p>${game.score} dari 6 ${type==='urut'?'posisi urutan':'jawaban'} tepat</p><div class="buttons"><button class="secondary" onclick="startGame('${type}')">↻ Main lagi</button><button class="secondary" onclick="game=null;render()">Pilih misi lain</button><button class="secondary" onclick="go('uji')">Uji kompetensi →</button></div></div><div class="panel"><h3>${type==='urut'?'Pembahasan urutan':'Apa yang sudah kita pelajari?'}</h3>${type==='urut'?`<p style="margin-top:15px">Urutanmu: ${game.order.map(esc).join(' → ')}</p><div class="stepflow">${['Kornea','Pupil','Lensa','Retina','Saraf optik','Otak'].map((x,i)=>`<div class="flowstep"><span>LANGKAH ${i+1} ${game.order[i]===x?'✓':'↻'}</span><b>${x}</b></div>`).join('')}</div><div class="callout">Cahaya melewati kornea, pupil, dan lensa hingga retina. Retina mengubah cahaya menjadi sinyal. Saraf optik membawa sinyal ke otak untuk diolah.</div>`:type==='hunt'?'<p style="margin-top:15px">Kornea dilalui cahaya; iris mengatur pupil; lensa membantu fokus; retina mengubah cahaya menjadi sinyal; saraf optik membawa sinyal ke otak; sklera melindungi bola mata.</p>':'<p style="margin-top:15px">Beri jeda dari layar, gunakan pencahayaan yang nyaman, makan bergizi seimbang, dan sampaikan keluhan kepada orang dewasa. Hindari menatap matahari dan mengarahkan laser ke mata.</p>'}<p class="hint" style="margin-top:18px">Skor = jumlah yang tepat ÷ 6 × 100, dibulatkan. Kamu boleh mencoba lagi untuk belajar.</p></div></div>`}
function leaveGame(){if(game&&!game.finished){showModal('<h2>Keluar dari misi?</h2><p>Skor misi yang sedang dimainkan akan dimulai ulang jika kamu kembali memainkannya.</p><div class="buttons" style="margin-top:24px"><button class="primary" onclick="closeModal()">Lanjut bermain</button><button class="secondary" onclick="game=null;closeModal();render()">Keluar misi</button></div>')}else{game=null;render()}}
function toggleSound(){sound=!sound;$('#soundBtn').innerHTML=`<span>♫</span> Suara ${sound?'aktif':'mati'}`;$('#soundBtn').setAttribute('aria-pressed',sound);$('#soundBtn').setAttribute('aria-label',sound?'Matikan efek suara':'Aktifkan efek suara');if(sound)beep('good')}
function beep(type='tap'){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=type==='good'?660:type==='bad'?250:450;g.gain.setValueAtTime(.055,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.22);o.start();o.stop(audioCtx.currentTime+.23)}catch{}}
function stopRead(){if(window.stopNarration)window.stopNarration()}
function toggleMotion(){motion=!motion;document.body.classList.toggle('reduced',motion);$('#motionBtn').textContent=motion?'Aktifkan animasi':'Kurangi animasi';$('#motionBtn').setAttribute('aria-pressed',motion)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Layar penuh tidak didukung. Gunakan mode layar penuh pada browser.')}catch{toast('Layar penuh dibatasi browser ini. Gunakan tombol layar penuh perangkat.')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4500)}
let lastFocus;function showModal(html){lastFocus=document.activeElement;$('#modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Informasi"><button class="close" onclick="closeModal()" aria-label="Tutup informasi">×</button>${html}</section></div>`;$('#modalroot .close').focus()}
function closeModal(){$('#modalroot').innerHTML='';lastFocus?.focus()}
function showInfo(type){if(type==='sumber')showModal(`<h2>Sumber & catatan materi</h2><p>Materi disusun untuk pengenalan fungsi mata pada kelas V SD. Diagram merupakan ilustrasi edukatif yang disederhanakan.</p><ul><li><a href="https://www.nei.nih.gov/eye-health-information/healthy-vision/how-eyes-work" target="_blank" rel="noopener">National Eye Institute — How the Eyes Work</a></li><li><a href="https://www.nei.nih.gov/eye-health-information/healthy-vision/nei-for-kids/about-eye" target="_blank" rel="noopener">National Eye Institute — About the Eye</a></li><li><a href="https://www.nei.nih.gov/eye-health-information/healthy-vision/nei-for-kids/healthy-vision-tips" target="_blank" rel="noopener">National Eye Institute — Healthy Vision Tips</a></li><li><a href="https://www.cdc.gov/vision-health/prevention/youth-vision-problems.html" target="_blank" rel="noopener">CDC — Keep an Eye on Your Child’s Vision</a></li></ul><p>Rujukan diakses 9 November 2026. Tautan rujukan memerlukan internet. Seluruh materi, ilustrasi, permainan, dan penilaian dalam file HTML dapat digunakan tanpa internet.</p><h3>Tentang visual “5D”</h3><p>Di sini, istilah tersebut diwujudkan sebagai efek kedalaman visual 3D berlapis, gerak, suara opsional, dan respons sentuhan. Ini bukan hologram atau tampilan lima dimensi fisik.</p>`);else showModal(`<h2>Selamat datang, penjelajah!</h2><p>MPI ini dapat dipakai sendiri, bersama orang tua, atau bergantian pada layar sentuh kelas.</p><h3>Urutan belajar yang disarankan</h3><ol><li><b>Jelajah Mata:</b> sentuh ketujuh bagian dan pelajari fungsinya.</li><li><b>Materi:</b> baca empat topik dengan contoh sederhana.</li><li><b>Lab Mini:</b> geser cahaya dan bandingkan ukuran pupil.</li><li><b>Arena Game:</b> mainkan tiga misi atau 8 soal latihan.</li><li><b>Uji Kompetensi:</b> jawab 10 soal, lihat skor dan pembahasan.</li></ol><h3>Nyaman di layar sentuh</h3><p>Semua aksi dapat dilakukan dengan ketukan; tidak perlu menyeret kartu. Gunakan Layar penuh jika didukung. Zoom browser tetap tersedia. Tombol juga bisa dipilih dengan Tab lalu Enter.</p><h3>Suara, hasil, dan penggunaan offline</h3><p>Suara efek bersifat opsional dan tidak mematikan narasi. Narasi bahasa Indonesia sudah disertakan. Sentuh Dengarkan, lalu gunakan putar/jeda, geser waktu, atau Berhenti pada pemutar. Suara efek terpisah dari narasi. Nama dan hasil tidak dikirim ke server dan tidak disimpan setelah halaman dimuat ulang. Unduh atau cetak hasil sebelum menutup halaman.</p><p>Untuk berganti siswa, muat ulang halaman. Berikan jeda dari layar selama pembelajaran. Skor kegiatan bukan nilai ketuntasan resmi sekolah.</p>`)}
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('keydown',e=>{if(!$('#modalroot .modal'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const a=[...document.querySelectorAll('#modalroot button,#modalroot a')];if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a[a.length-1].focus()}else if(!e.shiftKey&&document.activeElement===a[a.length-1]){e.preventDefault();a[0].focus()}}});
